globs: ["**/*.md"]
gitignore: true
config:
  MD013: false
  MD060:
    style: compact
overrides:
  - filter: [.github/pull_request_template.md]
    combine: merge
    config:
      MD041: false
      # The message contract requires adjacent Key changes bullets.
      MD032: false
  - filter: [.github/ISSUE_TEMPLATE/*.md]
    combine: merge
    config:
      MD041: false
