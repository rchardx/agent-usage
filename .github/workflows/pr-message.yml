name: PR message

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-message-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-message:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A PR cannot weaken its own message check. Tests exercise checker changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - name: Validate title and body with the base branch checker
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          message_file="$(mktemp)"
          trap 'rm -f "$message_file"' EXIT
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$message_file"
          uv run --no-project --python 3.11 python scripts/check_commit_msg.py "$message_file"
