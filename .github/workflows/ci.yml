name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      minimum: ${{ steps.versions.outputs.minimum }}
      development: ${{ steps.versions.outputs.development }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: versions
        run: python3 scripts/python_versions.py >> "$GITHUB_OUTPUT"

  check:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ needs.versions.outputs.minimum }}
          enable-cache: true
      - run: uv sync --locked --dev
      - name: Lint GitHub Actions workflows
        env:
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" # pragma: allowlist secret -- public release checksum
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          (
            cd "$RUNNER_TEMP"
            curl --fail --silent --show-error --location \
              "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$archive" \
              --output "$archive"
            printf '%s  %s\n' "$SHA256" "$archive" | sha256sum --check
            tar -xzf "$archive" actionlint
          )
          "$RUNNER_TEMP/actionlint"
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - run: git diff --exit-code
      - run: git diff --check

  test:
    needs: versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: ${{ needs.versions.outputs.minimum }}
          - os: ubuntu-latest
            python: ${{ needs.versions.outputs.development }}
          - os: macos-latest
            python: ${{ needs.versions.outputs.development }}
          - os: windows-latest
            python: ${{ needs.versions.outputs.development }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run --locked pytest -q

  package:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ needs.versions.outputs.minimum }}
      - run: uv sync --locked --dev
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - name: Test installed wheel outside the source tree
        shell: bash
        run: |
          wheel=("$PWD"/dist/*.whl)
          validator="$PWD/scripts/validate_report.py"
          cd "$(mktemp -d)"
          uv run --no-project --isolated --with "${wheel[0]}" agent-usage --version
          uv run --no-project --isolated --with "${wheel[0]}" agent-usage --help
          uv run --no-project --isolated --with "${wheel[0]}" agent-usage \
            --codex-home "$PWD/codex" --claude-home "$PWD/claude" \
            --pi-home "$PWD/pi" --omp-home "$PWD/omp" --cache-dir "$PWD/cache" \
            --offline --no-cost tokens --all --json > report.json
          uv run --no-project --isolated --with "${wheel[0]}" agent-usage schema > report.schema.json
          uv run --no-project --isolated --with "${wheel[0]}" \
            --with 'jsonschema>=4.23,<5' --with 'rfc3339-validator>=0.1.4,<1' \
            python "$validator" report.json

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        env:
          VERSION: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # pragma: allowlist secret -- public release checksum
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/$archive" \
            --output "$archive"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum --check
          mkdir -p gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan reachable history without exposing secret values
        run: gitleaks git . --log-opts="--all" --redact=100 --no-banner

  ci-ok:
    if: always()
    needs: [versions, check, test, package, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
