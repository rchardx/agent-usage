name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Replace a complete nightly even if main has not changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the triggering revision and inspect the rolling prerelease
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          api="repos/$GITHUB_REPOSITORY"
          sha=$GITHUB_SHA
          head=$(gh api "$api/git/ref/heads/main" --jq '.object.sha')
          [[ $head =~ ^[0-9a-f]{40}$ ]]
          if [[ $head != "$sha" ]]; then
            echo "Skipping superseded event for $sha; dispatch a new run to build $head."
            echo 'build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Listing returns an empty result for a missing tag/release, not for API failures.
          tag_sha=$(gh api "$api/git/matching-refs/tags/nightly" \
            --jq '.[] | select(.ref=="refs/tags/nightly" and .object.type=="tag") | .object.sha')
          if [[ -n $tag_sha ]]; then
            [[ $tag_sha =~ ^[0-9a-f]{40}$ ]]
            gh api "$api/git/tags/$tag_sha" > tag.json
          else
            echo 'null' > tag.json
          fi
          gh api --paginate "$api/releases?per_page=100" --jq '.[] | select(.tag_name=="nightly")' \
            | jq -s --slurpfile tag tag.json '{releases: ., tag: $tag[0]}' > state.json
          build=true
          if [[ $FORCE != true ]]; then
            complete=$(python3 scripts/nightly_complete.py "$sha" "$GITHUB_REPOSITORY" < state.json)
            if [[ $complete == true ]]; then build=false; fi
          fi
          printf 'sha=%s\nbuild=%s\n' "$sha" "$build" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pack.outputs.version }}
      minimum: ${{ steps.versions.outputs.minimum }}
      development: ${{ steps.versions.outputs.development }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - id: versions
        run: python3 scripts/python_versions.py >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ steps.versions.outputs.minimum }}
      - id: pack
        name: Build and check the nightly wheel and sdist
        shell: bash
        run: |
          uv sync --locked --dev
          sha=$(git rev-parse HEAD)
          version="$(uv version --short).dev${GITHUB_RUN_NUMBER}+g${sha:0:12}"
          uv version --no-sync "$version"
          uv build
          .venv/bin/twine check --strict dist/*
          test -s "dist/agent_usage-$version-py3-none-any.whl"
          unpacked=$(mktemp -d)
          tar -xzf "dist/agent_usage-$version.tar.gz" -C "$unpacked"
          (cd "$unpacked/agent_usage-$version" && uv lock --check)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-dist
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  verify:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python:
          - ${{ needs.build.outputs.minimum }}
          - ${{ needs.build.outputs.development }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nightly-dist
          path: ${{ runner.temp }}/dist
      - run: uv run --locked pytest -q
      - name: Smoke-test the installed wheel outside the checkout
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PYTHON: ${{ matrix.python }}
        run: |
          cd "$(mktemp -d)"
          uv venv --python "$PYTHON" .venv
          . .venv/bin/activate
          uv pip install "$RUNNER_TEMP/dist/agent_usage-$VERSION-py3-none-any.whl" \
            'jsonschema>=4.23,<5' 'rfc3339-validator>=0.1.4,<1'
          test "$(agent-usage --version)" = "$VERSION"
          agent-usage --help > /dev/null
          agent-usage --codex-home "$PWD/codex" --claude-home "$PWD/claude" \
            --pi-home "$PWD/pi" --omp-home "$PWD/omp" --cache-dir "$PWD/cache" \
            --offline --no-cost tokens --all --json > report.json
          agent-usage schema | python -m json.tool > schema.json
          python "$GITHUB_WORKSPACE/scripts/validate_report.py" report.json

  publish:
    needs: [plan, build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nightly-dist
          path: dist
      - name: Stage distributions, stamp annotated tag, and replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          api="repos/$GH_REPO"
          draft_id=""
          published=false
          cleanup_draft() {
            local status=$?
            if [[ $published != true && -n $draft_id ]]; then
              if [[ $(gh api "$api/releases/$draft_id" --jq '.draft' 2>/dev/null || true) == true ]]; then
                gh api -X DELETE "$api/releases/$draft_id" --silent || true
              fi
            fi
            exit "$status"
          }
          trap cleanup_draft EXIT
          # Re-running failed jobs can reuse the SHA from an earlier plan.
          head=$(gh api "$api/git/ref/heads/main" --jq '.object.sha')
          [[ $head =~ ^[0-9a-f]{40}$ ]]
          if [[ $head != "$SHA" ]]; then
            echo "Skipping superseded build: main is $head, not $SHA."
            exit 0
          fi
          wheel="agent_usage-$VERSION-py3-none-any.whl"
          sdist="agent_usage-$VERSION.tar.gz"
          test -s "dist/$wheel"
          test -s "dist/$sdist"
          notes="Rolling development build $VERSION from $GH_REPO@$SHA. Verified on the minimum and development Python versions. Build: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          # Recheck with write permission: a previous attempt may have left a draft or partial tag.
          tag_ref_sha=$(gh api "$api/git/matching-refs/tags/nightly" \
            --jq '.[] | select(.ref=="refs/tags/nightly" and .object.type=="tag") | .object.sha')
          if [[ -n $tag_ref_sha ]]; then
            [[ $tag_ref_sha =~ ^[0-9a-f]{40}$ ]]
            gh api "$api/git/tags/$tag_ref_sha" > tag.json
          else
            echo 'null' > tag.json
          fi
          gh api --paginate "$api/releases?per_page=100" --jq '.[] | select(.tag_name=="nightly")' \
            | jq -s --slurpfile tag tag.json '{releases: ., tag: $tag[0]}' > state.json
          decision=$(python3 scripts/nightly_complete.py "$SHA" "$GH_REPO" "$VERSION" < state.json)
          case "$decision" in
            skip)
              echo 'A newer nightly is already published for this commit.'
              exit 0
              ;;
            resume-clean)
              echo 'Verified published release and annotated tag; resuming cleanup.'
              ;;
            resume-tag)
              echo 'Verified published release; repairing annotated tag and cleanup.'
              tag_date=$(jq -r '.releases[0].published_at' state.json)
              ;;
            upload)
              draft_tag="nightly-draft-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              draft_id=$(jq -n \
                --arg tag "$draft_tag" \
                --arg target "$SHA" \
                '{
                  tag_name: $tag,
                  target_commitish: $target,
                  name: "Nightly",
                  body: "",
                  draft: true,
                  prerelease: true
                }' | gh api "$api/releases" --input - --jq '.id')
              [[ $draft_id =~ ^[0-9]+$ ]]
              gh release upload "$draft_tag" "dist/$wheel" "dist/$sdist" --clobber
              gh api "$api/releases/$draft_id" | python3 scripts/nightly_complete.py --verify-staged "$VERSION"
              tag_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              ;;
            *) exit 1 ;;
          esac
          if [[ $decision == upload || $decision == resume-tag ]]; then
            tag_sha=$(jq -n \
              --arg message "$notes" \
              --arg object "$SHA" \
              --arg date "$tag_date" \
              '{
                tag: "nightly",
                message: $message,
                object: $object,
                type: "commit",
                tagger: {
                  name: "github-actions[bot]",
                  email: "41898282+github-actions[bot]@users.noreply.github.com",
                  date: $date
                }
              }' | gh api "$api/git/tags" --input - --jq '.sha')
            [[ $tag_sha =~ ^[0-9a-f]{40}$ ]]
            has_tag=$(gh api "$api/git/matching-refs/tags/nightly" --jq 'any(.[]; .ref == "refs/tags/nightly")')
          fi
          if [[ $decision == upload ]]; then
            old_id=$(jq -r '.releases[0].id // empty' state.json)
            if [[ -n $old_id ]]; then
              gh api -X DELETE "$api/releases/$old_id"
            fi
          fi
          if [[ $decision == upload || $decision == resume-tag ]]; then
            if [[ $has_tag == true ]]; then
              gh api -X PATCH "$api/git/refs/tags/nightly" -f sha="$tag_sha" -F force=true --silent
            else
              gh api "$api/git/refs" -f ref="refs/tags/nightly" -f sha="$tag_sha" --silent
            fi
          fi
          if [[ $decision == upload ]]; then
            jq -n \
              --arg target "$SHA" \
              --arg body "$notes" \
              '{
                tag_name: "nightly",
                target_commitish: $target,
                name: "Nightly",
                body: $body,
                draft: false,
                prerelease: true,
                make_latest: "false"
              }' | gh api -X PATCH "$api/releases/$draft_id" --input - --silent
            published=true
          else
            gh release view nightly --json assets | jq -r --arg w "$wheel" --arg s "$sdist" \
              '.assets[] | select(.name!=$w and .name!=$s) | .apiUrl' > stale_assets
            while IFS= read -r asset; do
              if [[ -n $asset ]]; then gh api -X DELETE "$asset"; fi
            done < stale_assets
          fi
          gh api --paginate "$api/releases?per_page=100" \
            --jq '.[] | select(.draft == true and (.tag_name | test("^nightly-draft-[0-9]+-[0-9]+$"))) | .id' > stale_drafts
          while IFS= read -r id; do
            if [[ -n $id ]]; then gh api -X DELETE "$api/releases/$id"; fi
          done < stale_drafts
