[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-usage"
version = "0.1.0"
description = "Local-first Codex and Claude Code allowances and token usage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.16,<1", "rich>=14,<15", "platformdirs>=4,<5", "tzlocal>=5,<6"]

[project.scripts]
agent-usage = "agent_usage.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
